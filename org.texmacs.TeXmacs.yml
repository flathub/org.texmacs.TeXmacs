app-id: org.texmacs.TeXmacs
runtime: org.kde.Platform
runtime-version: "6.10"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.texlive
command: texmacs
rename-desktop-file: texmacs.desktop
rename-icon: texmacs
finish-args:
  - --socket=x11
  - --share=network
  - --device=dri
  - --share=ipc
  - --filesystem=xdg-documents
  - --filesystem=~/.local/share/fonts:ro
  - --persist=.TeXmacs
  - --env=PATH=/app/bin:/usr/bin:/app/texlive/bin

add-extensions:
  org.freedesktop.Sdk.Extension.texlive:
    version: "25.08"
    directory: texlive
    autodelete: false
    no-autodownload: true
    add-ld-path: lib
  org.texmacs.TeXmacs.Plugin:
    versions: stable;test;master
    directory: plugins
    subdirectories: true
    no-autodownload: true
    autodelete: true
    add-ld-path: lib
  io.github.wxmaxima_developers.wxMaxima.Plugin:
    versions: stable;beta;test;master
    directory: plugins
    subdirectories: true
    no-autodownload: true
    autodelete: true
    add-ld-path: lib
    
cleanup:
  - /include
  - /share/aclocal
  - /share/man
  - /share/doc
  - /share/info
  - /lib/pkgconfig
  - '*.la'
  - '*.a'
    
modules:
  - name: texliveYextensions
    buildsystem: simple
    build-commands:
      - install -d /app/texlive
      - install -d /app/plugins
      
  - name: poppler #pdf2svg
    buildsystem: cmake-ninja
    config-opts:
      - -DENABLE_QT5=OFF
      - -DBUILD_QT5_TESTS=OFF
      - -DBUILD_GTK_TESTS=OFF
    sources:
      - type: archive
        url: https://poppler.freedesktop.org/poppler-26.08.0.tar.xz
        sha256: dc906e68cea698109706ac6aa3d2c9d4512fcfcac42d90b8afcda486d1b9abd0
        
  - name: pdf2svg
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/dawbarton/pdf2svg.git
        commit: 2371ca32926354227f58ce6cab18a7bd54136252
        tag: v0.2.4
        
  - name: magick
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/ImageMagick/ImageMagick.git
        tag: 7.1.2-13
        commit: dd991e286b96918917a3392d6dc3ffc0e6907a4e
        
  - name: graphviz
    buildsystem: autotools
    sources:
      - type: archive
        url: https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/10.0.1/graphviz-10.0.1.tar.gz
        sha256: 72e1a575e9c382c4fd2267837962bc4582b3d9ad746e338cd8024bdeca124f32
        
  - name: eukleides # Debian patches
    buildsystem: autotools
    build-options:
      cflags: -std=gnu17
      make-install-args:
        - PREFIX=/app
    sources:
      - type: archive
        url: http://deb.debian.org/debian/pool/main/e/eukleides/eukleides_1.5.4.orig.tar.gz
        sha256: 5e72ad3c469bb37de7094d278af313e5620f9901c0af40bf8ad4df57e61e3ba6
      - type: patch
        path: patch-eukleides/cross.patch
      - type: patch
        path: patch-eukleides/fix_gcc-10.patch
      - type: patch
        path: patch-eukleides/ld-as-needed.diff
      - type: patch
        path: patch-eukleides/old-patches.diff
      - type: patch
        path: patch-eukleides/spelling-mistakes.diff
      - type: patch
        path: patch-eukleides/utf-8.patch
      - type: script   
        dest-filename: configure
        commands:
          - #/bin/sh
          
  - name: gnuplot
    buildsystem: autotools
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/gnuplot/6.0.3/gnuplot-6.0.3-c23.tar.gz
        sha256: dab1b3aaa6146d73ec4d022d20ddf4be124c27d03a52ca2d9577f05336d3bf2e
        
  - name: guile
    buildsystem: autotools
    config-opts:
      - --disable-static 
      - --disable-error-on-warning
    build-options:
      cflags: -std=gnu17
      arch:
        aarch64:
          config-opts:
            - --build=aarch64-unknown-linux-gnu
    sources:
      - type: archive
        url: http://ftp.gnu.org/gnu/guile/guile-1.8.8.tar.gz
        sha256: c3471fed2e72e5b04ad133bbaaf16369e8360283679bcf19800bc1b381024050
      - type: patch
        path: guile-1.8.8-configure.patch
        
  - name: ghostscript
    config-opts:
      - --disable-cups
    build-options:
      ldflags: -L/app/lib
      arch:
        aarch64:
          cppflags: -DPNG_ARM_NEON_OPT=0
    sources:
      - type: archive
        url: https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10060/ghostpdl-10.06.0.tar.gz
        sha256: 80dd50abf5970f49140ca7c0c19475cc2707437f89e8a825e670ba101003f1d8

  - name: pip
    buildsystem: simple
    build-commands:
      - install -Dm755 -t /app/bin pip.pyz
      - ln -s /app/bin/pip.pyz /app/bin/pip3 && ln -s /app/bin/pip.pyz /app/bin/pip
    sources:
      - type: file
        dest-filename: pip.pyz
        url: https://bootstrap.pypa.io/pip/zipapp/pip-25.1.pyz
        sha256: 42d5602660591dcb553876642bd4da47859d1de20324fbd461c631e520d5847f
        
  - name: xdg-utils # temporary #fake
    buildsystem: simple
    build-commands:
      - touch /app/bin/xdg-icon-resource /app/bin/xdg-mime /app/bin/xdg-desktop-menu 
      - touch /app/bin/xdg-desktop-icon /app/bin/xdg-icon-resource
      - chmod +x /app/bin/xdg-*
    cleanup:
      - /bin/xdg-*
      
  - name: texmacs
    buildsystem: autotools
    post-install:
      - install -Dm644 org.texmacs.TeXmacs.appdata.xml /app/share/appdata/org.texmacs.TeXmacs.appdata.xml
      - install -Dm644 TeXmacs/misc/mime/texmacs.desktop /app/share/applications/texmacs.desktop
      - desktop-file-edit --set-key=Keywords --set-value="LATEX;Giac;Macaulay;TeXLive;Gnuplot;Maxima;Cadabra" /app/share/applications/texmacs.desktop
      - install -Dm644 TeXmacs/misc/images/texmacs-256.png /app/share/icons/hicolor/256x256/apps/texmacs.png
      - mv /app/bin/texmacs /app/bin/texmacs-bin
      - install -Dm755 texmacs /app/bin/texmacs
      - install -Dm755 xdg-open -t /app/bin/
      - chmod +x search-configure-TEXfonts.sh && ./search-configure-TEXfonts.sh
      - install -Dm644 firts_run.tm -t /app/share/texmacs-flatpak/
    sources:
      - type: git
        url: https://github.com/texmacs/texmacs.git
        commit: 5575a3ddd7ded4e916c884c1b51c725124bc0299
      - type: patch
        path: init-cadabra.scm.patch
      - type: file
        path: wrapper/texmacs
      - type: file
        path: wrapper/firts_run.tm
      - type: file
        path: search-configure-TEXfonts.sh
      - type: file
        path: org.texmacs.TeXmacs.appdata.xml
      - type: file
        path: xdg-open
