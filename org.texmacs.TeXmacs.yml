app-id: org.texmacs.TeXmacs
runtime: org.kde.Platform
runtime-version: "6.8"
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.texlive
command: startTeXmacs.sh
rename-desktop-file: texmacs.desktop
rename-icon: texmacs
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=network
  - --device=dri
  - --share=ipc
  - --filesystem=xdg-documents
  - --filesystem=~/.local/share/fonts:ro
  - --persist=.TeXmacs
  - --env=PATH=/var/data/python/bin:/app/bin:/usr/bin:/app/plugins/pack1/bin:/app/plugins/maxima/bin:/app/texlive/bin

add-extensions:
  org.freedesktop.Sdk.Extension.texlive:
    version: "24.08"
    directory: texlive
    autodelete: false
    no-autodownload: true
    add-ld-path: lib
  org.texmacs.TeXmacs.Plugin:
    versions: stable;test;master
    directory: plugins
    subdirectories: true
    no-autodownload: true
    autodelete: true
    add-ld-path: lib
  io.github.wxmaxima_developers.wxMaxima.Plugin.maxima:
    versions: stable;beta;test;master
    directory: plugins/maxima
    subdirectories: false
    no-autodownload: true
    autodelete: true
    add-ld-path: lib
    
cleanup:
  - /include
  - /share/aclocal
  - /share/man
    
modules:
  - name: texliveYextensions
    buildsystem: simple
    build-commands:
      - install -d /app/texlive
      - install -d /app/plugins
        
  - name: dictEs-aspell
    buildsystem: simple
    build-commands:
      - ./configure
      - make dictdir=/app/share/dicts datadir=/app/share/datadicts
      - make dictdir=/app/share/dicts datadir=/app/share/datadicts install
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/aspell/dict/es/aspell6-es-1.11-2.tar.bz2
        sha256: ad367fa1e7069c72eb7ae37e4d39c30a44d32a6aa73cedccbd0d06a69018afcc
  - name: dictEn-aspell
    buildsystem: simple
    build-commands:
      - ./configure
      - make dictdir=/app/share/dicts datadir=/app/share/datadicts
      - make dictdir=/app/share/dicts datadir=/app/share/datadicts install
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/aspell/dict/en/aspell6-en-2020.12.07-0.tar.bz2
        sha256: 4c8f734a28a088b88bb6481fcf972d0b2c3dc8da944f7673283ce487eac49fb3
  - name: magick
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/ImageMagick/ImageMagick/archive/refs/tags/7.1.1-21.tar.gz
        sha256: 09402e5f17c6575ef9f010bb2e21ae1710f1f3426f115ad4317ee9129c32608e
  - name: graphviz
    buildsystem: autotools
    sources:
      - type: archive
        url: https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/10.0.1/graphviz-10.0.1.tar.gz
        sha256: 72e1a575e9c382c4fd2267837962bc4582b3d9ad746e338cd8024bdeca124f32
  - name: gnuplot
    buildsystem: autotools
    sources:
      - type: archive
        url: https://prdownloads.sourceforge.net/gnuplot/5.4.10/gnuplot-5.4.10.tar.gz
        sha256: 975d8c1cc2c41c7cedc4e323aff035d977feb9a97f0296dd2a8a66d197a5b27c

  - name: eukleides # Debian patches
    buildsystem: autotools
    build-options:
      make-install-args:
        - PREFIX=/app
    sources:
      - type: archive
        url: http://deb.debian.org/debian/pool/main/e/eukleides/eukleides_1.5.4.orig.tar.gz
        sha256: 5e72ad3c469bb37de7094d278af313e5620f9901c0af40bf8ad4df57e61e3ba6
      - type: patch
        path: patch-eukleides/cross.patch
      - type: patch
        path: patch-eukleides/fix_gcc-10.patch
      - type: patch
        path: patch-eukleides/ld-as-needed.diff
      - type: patch
        path: patch-eukleides/old-patches.diff
      - type: patch
        path: patch-eukleides/spelling-mistakes.diff
      - type: patch
        path: patch-eukleides/utf-8.patch
      - type: script   
        dest-filename: configure
        commands:
          - #/bin/sh
        
  - name: guile
    buildsystem: autotools
    config-opts:
      - --disable-static 
      - --disable-error-on-warning
    build-options:
      arch:
        aarch64:
          config-opts:
            - --build=aarch64-unknown-linux-gnu
    sources:
      - type: archive
        url: http://ftp.gnu.org/gnu/guile/guile-1.8.8.tar.gz
        sha256: c3471fed2e72e5b04ad133bbaaf16369e8360283679bcf19800bc1b381024050
      - type: patch
        path: guile-1.8.8-configure.patch
        
  - name: ghostscript
    config-opts:
      - --disable-cups
    build-options:
      ldflags: -L/app/lib
      arch:
        aarch64:
          cppflags: -DPNG_ARM_NEON_OPT=0
    sources:
      - type: archive
        url: https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10050/ghostscript-10.05.0.tar.gz
        sha512: e6890e72e7734cfe9b923a7bafae9c38a3ccca650b51374e403b6754f972dbca8278f44b3e3b32465309aacc73382dffae1b8deccb5469ff3637f7f3353dace9

  - name: pip
    buildsystem: simple
    build-commands:
      - install -Dm755 pip.pyz -t /app/bin/
      - ln -s /app/bin/pip.pyz /app/bin/pip
    sources:
      - type: file
        url: https://bootstrap.pypa.io/pip/pip.pyz
        sha256: d5e4733b8c3933cfbb46f1338578bc4cb4c54d65a040d5dc230766ad3c53d8f7
  - name: xdg-utils # temporary #fake
    buildsystem: simple
    build-commands:
      - touch /app/bin/xdg-icon-resource /app/bin/xdg-mime /app/bin/xdg-desktop-menu 
      - touch /app/bin/xdg-desktop-icon /app/bin/xdg-icon-resource
      - chmod +x /app/bin/xdg-*
    cleanup:
      - /bin/xdg-*
  - name: texmacs
    buildsystem: autotools
    post-install:
      - install -Dm644 org.texmacs.TeXmacs.appdata.xml /app/share/appdata/org.texmacs.TeXmacs.appdata.xml
      - install -Dm644 TeXmacs/misc/mime/texmacs.desktop /app/share/applications/texmacs.desktop
      - desktop-file-edit --set-key=Exec --set-value="startTeXmacs.sh %F" /app/share/applications/texmacs.desktop
      - desktop-file-edit --set-key=Keywords --set-value="LATEX;Giac;Macaulay;TeXLive;Gnuplot;Maxima;" /app/share/applications/texmacs.desktop
      - install -Dm644 TeXmacs/misc/images/texmacs-256.png /app/share/icons/hicolor/256x256/apps/texmacs.png
      - install -Dm755 startTeXmacs.sh /app/bin/startTeXmacs.sh
      - install -Dm755 xdg-open -t /app/bin/
      - chmod +x search-configure-TEXfonts.sh && ./search-configure-TEXfonts.sh
      - install -Dm644 firts_run.tm -t /app/share/texmacs-flatpak/
    sources:
      - type: git
        url: https://github.com/texmacs/texmacs.git
        commit: db1c41beb3844bde17fdb643d677f15710016e76
      - type: file
        path: wrapper/startTeXmacs.sh
      - type: file
        path: wrapper/firts_run.tm
      - type: file
        path: search-configure-TEXfonts.sh
      - type: file
        path: org.texmacs.TeXmacs.appdata.xml
      - type: file
        path: xdg-open
